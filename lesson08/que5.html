<!DOCTYPE html>
<html>
<head>
    <title>Uber Request a Ride</title>

    <style>
        .box {
            width: 350px;
            padding: 15px;
            border: 1px solid #ddd;
        }

        h1 {
            font-family: Arial;
            font-size: 32px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .location {
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            border: none;
            background-color: #f2f2f2;
            box-sizing: border-box;
            font-size: 14px;
        }

        .request {
            background-color: black;
            color: white;
            border: none;
            padding: 13px 20px;
            margin-top: 25px;
            margin-right: 15px;
        }

        .schedule {
            background-color: #f2f2f2;
            color: black;
            border: none;
            padding: 13px 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Request a ride now</h1>

        <input class="location"
               type="text"
               placeholder="Enter pickup location">

        <input class="location"
               type="text"
               placeholder="Enter destination">

        <button class="request">
            Request now
        </button>

        <button class="schedule">
            Schedule for later
        </button>

    </div>

</body>
</html>

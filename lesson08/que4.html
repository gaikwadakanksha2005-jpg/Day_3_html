<!DOCTYPE html>
<html>
<head>
    <style>
        .box {
            width: 350px;
            padding: 15px;
            border: 1px solid #ddd;
        }
        .name {
            width: 155px;
            padding: 12px;
            margin-right: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        .email {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        .signup {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background-color: rgb(50, 110, 220);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <input class="name"type="text"placeholder="First name">
        <input class="name"type="text"placeholder="First name">
        <input class="email"type="text"placeholder="Email">
        <button class="signup">Sign Up</button>
    </div>
</body>
</html>

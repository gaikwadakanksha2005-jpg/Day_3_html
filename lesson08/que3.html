<!DOCTYPE html>
<html>
<head>
    <title>Google Search</title>
     <style>
        .google-logo {
            width: 250px;
            display: block;
            margin-left: 100px;
            margin-bottom: 0px;
        }
        .search-box {
            width: 400px;
            padding: 12px 10px;
            border-radius: 25px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <img class="google-logo" src="img/google.png">
    <input class="search-box"
           type="text"
           placeholder="Search Google or type a URL">
</body>
</html>

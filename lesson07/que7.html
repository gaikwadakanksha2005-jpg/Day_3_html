<!DOCTYPE html>
<html>
<head>
    <style>
        .twitter {
            width: 500px;
            padding: 10px;
            border: 1px solid lightgray;
        }

        .profile {
            width: 40px;
            height: 45px;
            border-radius: 15px;
            object-fit: cover;

            vertical-align: middle;
        }

        .text {
            color: gray;
            margin-left: 10px;

            vertical-align: middle;
        }

        .tweet {
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 80px;
            padding: 10px 10px;
            margin-left: 250px;
            cursor: pointer;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <div class="twitter">
        <img class="profile" src="images/dog.jpg">

        <span class="text">
            What's happening?
        </span>
        <button class="tweet">
            Tweet
        </button>
    </div>
</body>
</html>

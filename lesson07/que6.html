<!DOCTYPE html>
<html>
    <head>
      <style>
        .box{
            width:300px;
        }
        label{
            display:block;
            margin-bottom:8px;
        }
        input{
            width:100%;
            box-sizing: border-box;
            padding:10px;
        }
        .privacy{
            font-size:12px;
            color:rgb(129, 129, 225);
        }
        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius: 25px;
            background-color: rgb(62, 62, 218);
            color:white;
            font:16px;
            cursor:pointer;
        }
      </style>
    </head>
    <body>
        <div class="box">
        <label>Email</label>
        <input type="text">
        <p class="privacy">
            By clicking Agree & Join, you agree to the Privacy Policy.
        </p>
        <button>Agree & Join</button>
       </div>
    </body>
</html>
